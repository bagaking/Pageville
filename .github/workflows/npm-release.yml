name: Release Rust binaries and npm package

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, cross: false }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-latest, cross: true }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, runner: macos-13, cross: false }
          - { target: aarch64-apple-darwin, runner: macos-14, cross: false }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, cross: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build binary
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --locked --release --target '${{ matrix.target }}'
          else
            cargo build --locked --release --target '${{ matrix.target }}'
          fi
          mkdir -p artifact
          binary="target/${{ matrix.target }}/release/pageville"
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then binary="$binary.exe"; fi
          cp "$binary" artifact/
          if [[ "${{ matrix.cross }}" != "true" ]]; then
            "$binary" --version
          fi
          tar -czf "pageville-${{ matrix.target }}.tar.gz" -C artifact .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "pageville-${{ matrix.target }}.tar.gz" > "pageville-${{ matrix.target }}.sha256"
          else
            shasum -a 256 "pageville-${{ matrix.target }}.tar.gz" > "pageville-${{ matrix.target }}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pageville-${{ matrix.target }}
          path: |
            pageville-${{ matrix.target }}.tar.gz
            pageville-${{ matrix.target }}.sha256
            artifact/pageville*

  publish:
    name: Publish npm package and GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check tag and stage npm binaries
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version $version" >&2
            exit 1
          fi
          node scripts/npm/stage.js --clean
          for target in \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
            x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            binary="$(find "artifacts/pageville-$target" -type f \( -name pageville -o -name pageville.exe \) -print -quit)"
            test -n "$binary"
            node scripts/npm/stage.js --target "$target" --binary "$binary"
          done
          npm run npm:check
          npm run npm:verify
      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/**/*.tar.gz'
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --provenance --access public
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/pageville-*/*
